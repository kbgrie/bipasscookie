<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Cookie Refresher</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --ok: #3fb950;
      --fail: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
    textarea {
      width: 100%;
      height: 200px;
      background: #090d13;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 12px;
      resize: vertical;
      outline: none;
    }
    textarea:focus, input[type="url"]:focus { border-color: var(--accent); }
    input[type="url"] {
      width: 100%;
      background: #090d13;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .controls {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .ctrl-group { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    input[type="number"] {
      width: 72px;
      background: #090d13;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
    }
    input[type="file"] { display: none; }
    .btn {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 13px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { border-color: #8b949e; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: flex; gap: 16px; font-weight: 600; }
    .ok { color: var(--ok); }
    .fail { color: var(--fail); }
    .log-box {
      height: 220px;
      overflow-y: auto;
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>
    <span>Cookie Refresher</span>
    <span class="badge">core: cookie_refresher.py</span>
  </h1>

  <div class="grid">
    <div class="card">
      <div class="card-head">
        <span>Accounts (user:pass:cookie) — <b id="accCount">0</b> dòng</span>
        <label class="btn">Tải file .txt<input type="file" id="accFile" accept=".txt" /></label>
      </div>
      <textarea id="accounts" placeholder="user1:pass1:_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
    </div>

    <div class="card">
      <div class="card-head">
        <span>Proxies (tùy chọn) — <b id="proxyCount">0</b> dòng</span>
        <label class="btn">Tải file .txt<input type="file" id="proxyFile" accept=".txt" /></label>
      </div>
      <textarea id="proxies" placeholder="host:port:user:pass&#10;http://user:pass@host:port&#10;host:port"></textarea>
    </div>
  </div>

  <div class="card" style="margin-top: 14px;">
    <div class="card-head">
      <span>Webhook URL (gửi file .txt kết quả ngầm sau khi xong — tùy chọn)</span>
      <span style="font-size:11px;">background 100%</span>
    </div>
    <input
      type="url"
      id="webhookUrl"
      placeholder="https://discord.com/api/webhooks/... hoặc endpoint nhận multipart file"
    />
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>Threads: <input type="number" id="threads" value="10" min="1" max="100" /></label>
      <label><input type="checkbox" id="keepFailed" /> Giữ lại acc fail (--keep-failed)</label>
      <button class="btn btn-primary" id="runBtn">Bắt đầu Refresh</button>
    </div>
    <div class="stats">
      <span>Tổng: <span id="stTotal">0</span></span>
      <span class="ok">OK: <span id="stOk">0</span></span>
      <span class="fail">FAIL: <span id="stFail">0</span></span>
    </div>
  </div>

  <div class="grid" style="margin-top: 14px;">
    <div class="card">
      <div class="card-head">
        <span>Live Log</span>
        <button class="btn" id="clearLogBtn">Xóa log</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <span>Output Refreshed</span>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="copyBtn">Copy</button>
          <a class="btn" id="downloadBtn" style="display:none;">Tải .txt</a>
        </div>
      </div>
      <textarea id="output" readonly placeholder="Kết quả refreshed sẽ hiện tại đây..."></textarea>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function countValidLines(text) {
    return text.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#")).length;
  }

  function updateCounts() {
    $("accCount").textContent = countValidLines($("accounts").value);
    $("proxyCount").textContent = countValidLines($("proxies").value);
  }

  function bindFile(inputId, targetId) {
    $(inputId).addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        $(targetId).value = reader.result;
        updateCounts();
      };
      reader.readAsText(file, "utf-8");
    });
  }

  bindFile("accFile", "accounts");
  bindFile("proxyFile", "proxies");
  $("accounts").addEventListener("input", updateCounts);
  $("proxies").addEventListener("input", updateCounts);

  function appendLog(tag, msg, cls = "") {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = `[${tag}] ${msg}`;
    $("logBox").appendChild(div);
    $("logBox").scrollTop = $("logBox").scrollHeight;
  }

  $("clearLogBtn").onclick = () => { $("logBox").innerHTML = ""; };
  $("copyBtn").onclick = async () => {
    if (!$("output").value) return;
    await navigator.clipboard.writeText($("output").value);
    $("copyBtn").textContent = "Đã copy";
    setTimeout(() => ($("copyBtn").textContent = "Copy"), 1200);
  };

  $("runBtn").onclick = async () => {
    const accounts_text = $("accounts").value.trim();
    if (!accounts_text) {
      appendLog("ERR", "Chưa nhập danh sách account.", "fail");
      return;
    }

    $("runBtn").disabled = true;
    $("output").value = "";
    $("logBox").innerHTML = "";
    $("downloadBtn").style.display = "none";
    $("stTotal").textContent = "0";
    $("stOk").textContent = "0";
    $("stFail").textContent = "0";

    try {
      const res = await fetch("/api/refresh/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          accounts_text,
          proxies_text: $("proxies").value,
          threads: parseInt($("threads").value, 10) || 10,
          keep_failed: $("keepFailed").checked,
          webhook_url: $("webhookUrl").value.trim(),
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        appendLog("ERR", err.detail || "Lỗi request", "fail");
        $("runBtn").disabled = false;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const chunks = buffer.split("\n\n");
        buffer = chunks.pop();

        for (const chunk of chunks) {
          let eventName = "message";
          let dataLine = "";
          for (const line of chunk.split("\n")) {
            if (line.startsWith("event: ")) eventName = line.slice(7).trim();
            if (line.startsWith("data: ")) dataLine = line.slice(6).trim();
          }
          if (!dataLine) continue;
          const data = JSON.parse(dataLine);

          if (eventName === "start") {
            $("stTotal").textContent = data.total;
            appendLog("INFO", `${data.total} accounts, ${data.proxies} proxies, ${data.threads} threads`);
            if (data.proxies === 0) {
              appendLog("WARN", "Không có proxy — refresh trực tiếp bằng IP của server Render");
            }
          } else if (eventName === "progress") {
            $("stOk").textContent = data.ok;
            $("stFail").textContent = data.fail;
            if (data.status === "OK") {
              appendLog("OK", `${data.user} -> ${data.detail}`, "ok");
              $("output").value += data.line + "\n";
            } else {
              appendLog("FAIL", `${data.user} - ${data.detail}`, "fail");
              if (data.line) $("output").value += data.line + "\n";
            }
          } else if (eventName === "done") {
            appendLog("DONE", `success ${data.ok} / fail ${data.fail}`);
            if (data.webhook_dispatched) {
              appendLog("INFO", "Đã đẩy job gửi file về webhook chạy ngầm.");
            }
            $("downloadBtn").href = `/api/download/${data.job_id}`;
            $("downloadBtn").style.display = "inline-flex";
          }
        }
      }
    } catch (e) {
      appendLog("ERR", e.message, "fail");
    } finally {
      $("runBtn").disabled = false;
    }
  };
</script>
</body>
</html>
